<!DOCTYPE html>
<html lang="en">

<head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>ORBIT - Recording Player</title>
      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
            rel="stylesheet">
      <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
      <style>
            * {
                  margin: 0;
                  padding: 0;
                  box-sizing: border-box;
            }

            body {
                  font-family: 'Inter', sans-serif;
                  background: #0a0a1a;
                  color: #e2e8f0;
                  min-height: 100vh;
                  display: flex;
                  flex-direction: column;
                  overflow: hidden;
            }

            /* ===== HEADER ===== */
            .player-header {
                  background: rgba(15, 15, 35, 0.95);
                  backdrop-filter: blur(20px);
                  padding: 14px 28px;
                  display: flex;
                  align-items: center;
                  justify-content: space-between;
                  border-bottom: 1px solid rgba(255, 255, 255, 0.06);
                  z-index: 10;
            }

            .header-left {
                  display: flex;
                  align-items: center;
                  gap: 16px;
            }

            .back-btn {
                  background: rgba(255, 255, 255, 0.06);
                  border: none;
                  color: #94a3b8;
                  width: 36px;
                  height: 36px;
                  border-radius: 10px;
                  cursor: pointer;
                  font-size: 14px;
                  display: flex;
                  align-items: center;
                  justify-content: center;
                  transition: all 0.2s;
            }

            .back-btn:hover {
                  background: rgba(255, 255, 255, 0.12);
                  color: white;
            }

            .header-info h1 {
                  font-size: 16px;
                  font-weight: 600;
                  color: white;
                  max-width: 400px;
                  white-space: nowrap;
                  overflow: hidden;
                  text-overflow: ellipsis;
            }

            .header-meta {
                  display: flex;
                  align-items: center;
                  gap: 12px;
                  font-size: 12px;
                  color: #64748b;
                  margin-top: 2px;
            }

            .header-meta span {
                  display: flex;
                  align-items: center;
                  gap: 4px;
            }

            .header-right {
                  display: flex;
                  align-items: center;
                  gap: 10px;
            }

            .header-badge {
                  background: linear-gradient(135deg, #6366f1, #8b5cf6);
                  padding: 5px 14px;
                  border-radius: 20px;
                  font-size: 12px;
                  font-weight: 600;
                  color: white;
                  display: flex;
                  align-items: center;
                  gap: 6px;
            }

            /* ===== MAIN LAYOUT ===== */
            .main-wrapper {
                  flex: 1;
                  display: flex;
                  overflow: hidden;
                  height: calc(100vh - 60px);
            }

            /* Video Section */
            .video-section {
                  flex: 1;
                  display: flex;
                  flex-direction: column;
                  min-width: 0;
            }

            .video-container {
                  flex: 1;
                  display: flex;
                  align-items: center;
                  justify-content: center;
                  padding: 20px;
                  position: relative;
                  background: #000;
            }

            video {
                  max-width: 100%;
                  max-height: 100%;
                  border-radius: 12px;
                  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
            }

            /* Subtitle Overlay */
            .subtitle-overlay {
                  position: absolute;
                  bottom: 50px;
                  left: 50%;
                  transform: translateX(-50%);
                  background: rgba(0, 0, 0, 0.85);
                  padding: 10px 24px;
                  border-radius: 10px;
                  font-size: 17px;
                  line-height: 1.5;
                  max-width: 80%;
                  text-align: center;
                  display: none;
                  backdrop-filter: blur(10px);
                  color: white;
                  border: 1px solid rgba(255, 255, 255, 0.08);
                  animation: fadeUp 0.2s ease;
            }

            @keyframes fadeUp {
                  from {
                        opacity: 0;
                        transform: translateX(-50%) translateY(6px);
                  }

                  to {
                        opacity: 1;
                        transform: translateX(-50%) translateY(0);
                  }
            }

            /* ===== CONTROLS BAR ===== */
            .controls-bar {
                  background: rgba(15, 15, 35, 0.95);
                  backdrop-filter: blur(20px);
                  padding: 14px 24px;
                  border-top: 1px solid rgba(255, 255, 255, 0.06);
                  display: flex;
                  align-items: center;
                  gap: 16px;
                  flex-wrap: wrap;
            }

            .controls-group {
                  display: flex;
                  align-items: center;
                  gap: 8px;
            }

            .ctrl-btn {
                  background: rgba(255, 255, 255, 0.06);
                  border: 1px solid rgba(255, 255, 255, 0.08);
                  color: #cbd5e1;
                  min-width: 38px;
                  height: 38px;
                  border-radius: 10px;
                  cursor: pointer;
                  font-size: 14px;
                  transition: all 0.2s;
                  display: flex;
                  align-items: center;
                  justify-content: center;
                  gap: 6px;
                  padding: 0 10px;
            }

            .ctrl-btn:hover {
                  background: rgba(255, 255, 255, 0.12);
                  color: white;
            }

            .ctrl-btn.active {
                  background: #6366f1;
                  color: white;
                  border-color: #6366f1;
            }

            .ctrl-btn span {
                  font-size: 12px;
                  font-weight: 600;
                  white-space: nowrap;
            }

            .speed-select,
            .lang-select {
                  background: rgba(255, 255, 255, 0.06);
                  border: 1px solid rgba(255, 255, 255, 0.1);
                  color: #e2e8f0;
                  padding: 8px 12px;
                  border-radius: 10px;
                  font-size: 13px;
                  font-family: inherit;
                  cursor: pointer;
                  outline: none;
            }

            .speed-select option,
            .lang-select option {
                  background: #1e1e3a;
                  color: #e2e8f0;
            }

            .controls-separator {
                  width: 1px;
                  height: 24px;
                  background: rgba(255, 255, 255, 0.1);
                  margin: 0 4px;
            }

            /* ===== TRANSCRIPT PANEL ===== */
            .transcript-panel {
                  width: 380px;
                  background: rgba(15, 15, 35, 0.98);
                  border-left: 1px solid rgba(255, 255, 255, 0.06);
                  display: flex;
                  flex-direction: column;
                  transition: all 0.3s ease;
                  overflow: hidden;
            }

            .transcript-panel.collapsed {
                  width: 0;
                  border: none;
            }

            .transcript-header {
                  padding: 16px 20px;
                  border-bottom: 1px solid rgba(255, 255, 255, 0.06);
                  display: flex;
                  align-items: center;
                  justify-content: space-between;
                  flex-shrink: 0;
            }

            .transcript-header h3 {
                  font-size: 14px;
                  font-weight: 700;
                  color: white;
                  display: flex;
                  align-items: center;
                  gap: 8px;
            }

            .transcript-search {
                  margin: 12px 16px;
                  position: relative;
                  flex-shrink: 0;
            }

            .transcript-search input {
                  width: 100%;
                  padding: 10px 14px 10px 36px;
                  background: rgba(255, 255, 255, 0.06);
                  border: 1px solid rgba(255, 255, 255, 0.1);
                  border-radius: 10px;
                  color: white;
                  font-size: 13px;
                  outline: none;
                  font-family: inherit;
            }

            .transcript-search input::placeholder {
                  color: #64748b;
            }

            .transcript-search input:focus {
                  border-color: #6366f1;
            }

            .transcript-search i {
                  position: absolute;
                  left: 12px;
                  top: 50%;
                  transform: translateY(-50%);
                  color: #64748b;
                  font-size: 13px;
            }

            .transcript-list {
                  flex: 1;
                  overflow-y: auto;
                  padding: 8px 16px 20px;
            }

            .transcript-list::-webkit-scrollbar {
                  width: 4px;
            }

            .transcript-list::-webkit-scrollbar-track {
                  background: transparent;
            }

            .transcript-list::-webkit-scrollbar-thumb {
                  background: rgba(255, 255, 255, 0.15);
                  border-radius: 4px;
            }

            .transcript-item {
                  padding: 10px 12px;
                  border-radius: 8px;
                  cursor: pointer;
                  transition: all 0.15s;
                  display: flex;
                  gap: 12px;
                  margin-bottom: 2px;
            }

            .transcript-item:hover {
                  background: rgba(255, 255, 255, 0.04);
            }

            .transcript-item.active {
                  background: rgba(99, 102, 241, 0.12);
            }

            .transcript-item.highlight {
                  background: rgba(250, 204, 21, 0.1);
            }

            .transcript-time {
                  font-size: 11px;
                  color: #6366f1;
                  font-weight: 600;
                  font-variant-numeric: tabular-nums;
                  flex-shrink: 0;
                  padding-top: 2px;
                  min-width: 40px;
            }

            .transcript-text {
                  font-size: 13px;
                  line-height: 1.5;
                  color: #cbd5e1;
            }

            .transcript-text mark {
                  background: rgba(250, 204, 21, 0.3);
                  color: white;
                  border-radius: 2px;
                  padding: 0 2px;
            }

            .transcript-empty {
                  text-align: center;
                  padding: 40px 20px;
                  color: #64748b;
            }

            .transcript-empty i {
                  font-size: 36px;
                  margin-bottom: 12px;
                  display: block;
                  color: #475569;
            }

            .transcript-status {
                  padding: 8px 16px;
                  font-size: 12px;
                  color: #64748b;
                  border-top: 1px solid rgba(255, 255, 255, 0.06);
                  display: flex;
                  align-items: center;
                  gap: 6px;
                  flex-shrink: 0;
            }

            .pulse-dot {
                  width: 8px;
                  height: 8px;
                  background: #ef4444;
                  border-radius: 50%;
                  animation: pulse 1.5s infinite;
            }

            @keyframes pulse {

                  0%,
                  100% {
                        opacity: 1;
                  }

                  50% {
                        opacity: 0.4;
                  }
            }

            /* Status Toast */
            .status-toast {
                  position: fixed;
                  top: 80px;
                  left: 50%;
                  transform: translateX(-50%);
                  background: rgba(99, 102, 241, 0.95);
                  color: white;
                  padding: 10px 24px;
                  border-radius: 12px;
                  font-size: 13px;
                  font-weight: 500;
                  z-index: 999;
                  display: none;
                  backdrop-filter: blur(10px);
                  animation: fadeUp 0.3s ease;
            }

            /* Responsive */
            @media (max-width: 768px) {
                  .transcript-panel {
                        width: 100%;
                        position: absolute;
                        right: 0;
                        z-index: 20;
                        height: calc(100vh - 60px);
                  }

                  .transcript-panel.collapsed {
                        width: 0;
                  }

                  .header-info h1 {
                        max-width: 200px;
                        font-size: 14px;
                  }

                  .controls-bar {
                        padding: 10px 16px;
                        gap: 8px;
                  }
            }
      </style>
</head>

<body>
      <!-- HEADER -->
      <div class="player-header">
            <div class="header-left">
                  <button class="back-btn" onclick="window.close()" title="Close">
                        <i class="fa-solid fa-arrow-left"></i>
                  </button>
                  <div class="header-info">
                        <h1 id="rec-title">Recording Playback</h1>
                        <div class="header-meta">
                              <span id="meta-faculty"><i class="fa-solid fa-user"></i> Faculty</span>
                              <span id="meta-date"><i class="fa-regular fa-calendar"></i> --</span>
                              <span id="meta-duration"><i class="fa-regular fa-clock"></i> --:--</span>
                        </div>
                  </div>
            </div>
            <div class="header-right">
                  <div class="header-badge">
                        <i class="fa-solid fa-language"></i>
                        <span id="lang-label">English</span>
                  </div>
            </div>
      </div>

      <!-- MAIN LAYOUT -->
      <div class="main-wrapper">
            <!-- Video Section -->
            <div class="video-section">
                  <div class="video-container">
                        <video id="video-player" controls crossorigin="anonymous"></video>
                        <div class="subtitle-overlay" id="subtitle-overlay"></div>
                  </div>

                  <!-- Controls Bar -->
                  <div class="controls-bar">
                        <div class="controls-group">
                              <label style="font-size:12px; color:#64748b; font-weight:600;">SPEED</label>
                              <select class="speed-select" id="speed-select" title="Playback speed">
                                    <option value="0.5">0.5x</option>
                                    <option value="0.75">0.75x</option>
                                    <option value="1" selected>1x</option>
                                    <option value="1.25">1.25x</option>
                                    <option value="1.5">1.5x</option>
                                    <option value="2">2x</option>
                              </select>
                        </div>

                        <div class="controls-separator"></div>

                        <div class="controls-group">
                              <label style="font-size:12px; color:#64748b; font-weight:600;">LANGUAGE</label>
                              <select class="lang-select" id="lang-select" title="Translation language">
                                    <option value="en">English</option>
                                    <option value="te">Telugu</option>
                                    <option value="hi">Hindi</option>
                                    <option value="ta">Tamil</option>
                                    <option value="ml">Malayalam</option>
                              </select>
                        </div>

                        <div class="controls-separator"></div>

                        <button class="ctrl-btn active" id="subtitle-btn" title="Toggle subtitles">
                              <i class="fa-solid fa-closed-captioning"></i>
                              <span>CC</span>
                        </button>

                        <button class="ctrl-btn" id="transcript-toggle-btn" title="Toggle transcript panel">
                              <i class="fa-solid fa-align-left"></i>
                              <span>Transcript</span>
                        </button>

                        <div style="flex:1"></div>

                        <button class="ctrl-btn" id="download-btn" title="Download recording">
                              <i class="fa-solid fa-download"></i>
                              <span>Download</span>
                        </button>
                  </div>
            </div>

            <!-- Transcript Panel -->
            <div class="transcript-panel" id="transcript-panel">
                  <div class="transcript-header">
                        <h3><i class="fa-solid fa-scroll"></i> Transcript</h3>
                        <button class="back-btn" onclick="toggleTranscriptPanel()" title="Close panel">
                              <i class="fa-solid fa-xmark"></i>
                        </button>
                  </div>
                  <div class="transcript-search">
                        <i class="fa-solid fa-magnifying-glass"></i>
                        <input type="text" id="transcript-search-input" placeholder="Search transcript...">
                  </div>
                  <div class="transcript-list" id="transcript-list">
                        <div class="transcript-empty">
                              <i class="fa-solid fa-microphone-lines"></i>
                              <div style="font-size:14px; font-weight:600; margin-bottom:6px;">Live Transcription</div>
                              <div style="font-size:13px;">Play the video to start generating subtitles using speech
                                    recognition</div>
                        </div>
                  </div>
                  <div class="transcript-status" id="transcript-status">
                        <i class="fa-solid fa-circle-info"></i> Ready — play video to begin
                  </div>
            </div>
      </div>

      <!-- Status Toast -->
      <div class="status-toast" id="status-toast"></div>

      <script>
            // ===== INITIALIZATION =====
            const params = new URLSearchParams(window.location.search);
            const filename = params.get('file');
            const directSrc = params.get('src');
            const lang = params.get('lang') || 'en';
            const title = decodeURIComponent(params.get('title') || 'Recording');
            const faculty = decodeURIComponent(params.get('faculty') || 'Faculty');
            const recDate = params.get('date') || '';
            const recDuration = params.get('duration') || '';

            const API_BASE = 'https://orbitbackend-0i66.onrender.com';

            const langNames = {
                  'en': 'English', 'te': 'Telugu', 'hi': 'Hindi',
                  'ta': 'Tamil', 'ml': 'Malayalam'
            };

            const langCodes = {
                  'en': 'en-US', 'te': 'te-IN', 'hi': 'hi-IN',
                  'ta': 'ta-IN', 'ml': 'ml-IN'
            };

            // Set page info
            document.getElementById('rec-title').textContent = title;
            document.getElementById('lang-label').textContent = langNames[lang] || 'English';
            document.getElementById('meta-faculty').innerHTML = `<i class="fa-solid fa-user"></i> ${faculty}`;
            if (recDate) {
                  document.getElementById('meta-date').innerHTML = `<i class="fa-regular fa-calendar"></i> ${recDate}`;
            }
            if (recDuration) {
                  const mins = Math.floor(recDuration / 60);
                  const secs = recDuration % 60;
                  document.getElementById('meta-duration').innerHTML = `<i class="fa-regular fa-clock"></i> ${mins}m ${secs}s`;
            }
            document.title = `ORBIT - ${title}`;
            document.getElementById('lang-select').value = lang;

            // Set video source
            const video = document.getElementById('video-player');
            if (directSrc) {
                  video.src = directSrc;
            } else if (filename) {
                  video.src = `${API_BASE}/api/recordings/file/${filename}`;
            } else {
                  document.querySelector('.video-container').innerHTML = `
                <div style="text-align:center; padding:60px; color:#ef4444; font-size:18px;">
                    <i class="fa-solid fa-triangle-exclamation" style="font-size:48px; margin-bottom:16px; display:block;"></i>
                    No recording source provided
                </div>`;
            }

            // ===== WEB SPEECH API TRANSCRIPTION ENGINE =====
            let recognition = null;
            let transcriptSegments = []; // { time: seconds, text: string, translated: string }
            let isTranscribing = false;
            let subtitlesEnabled = true;
            let currentLang = lang;
            let translationCache = {}; // Avoid re-translating same text

            // Check browser support
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

            function initSpeechRecognition() {
                  if (!SpeechRecognition) {
                        updateTranscriptStatus('Speech recognition not supported in this browser', 'error');
                        return false;
                  }

                  recognition = new SpeechRecognition();
                  recognition.continuous = true;
                  recognition.interimResults = true;
                  recognition.lang = 'en-US'; // Always recognize English (source language)
                  recognition.maxAlternatives = 1;

                  let interimText = '';

                  recognition.onresult = (event) => {
                        let finalText = '';
                        let interim = '';

                        for (let i = event.resultIndex; i < event.results.length; i++) {
                              const result = event.results[i];
                              if (result.isFinal) {
                                    finalText += result[0].transcript.trim() + ' ';
                              } else {
                                    interim += result[0].transcript;
                              }
                        }

                        // Show interim results as subtitles
                        if (interim && subtitlesEnabled) {
                              showSubtitle(interim, true);
                        }

                        // Process final results
                        if (finalText.trim()) {
                              const currentTime = Math.floor(video.currentTime);
                              const segment = {
                                    time: currentTime,
                                    text: finalText.trim(),
                                    translated: ''
                              };

                              // Translate if target language is not English
                              if (currentLang !== 'en') {
                                    translateText(finalText.trim(), currentLang).then(translated => {
                                          segment.translated = translated;
                                          if (subtitlesEnabled) showSubtitle(translated, false);
                                          updateTranscriptList();
                                    });
                              } else {
                                    segment.translated = finalText.trim();
                                    if (subtitlesEnabled) showSubtitle(finalText.trim(), false);
                              }

                              transcriptSegments.push(segment);
                              updateTranscriptList();
                        }
                  };

                  recognition.onerror = (event) => {
                        console.warn('Speech recognition error:', event.error);
                        if (event.error === 'no-speech') {
                              // This is normal, just keep going
                              return;
                        }
                        if (event.error === 'not-allowed') {
                              updateTranscriptStatus('Microphone access denied. Enable it in browser settings.', 'error');
                              return;
                        }
                        // Auto-restart on other errors
                        if (isTranscribing) {
                              setTimeout(() => startTranscription(), 500);
                        }
                  };

                  recognition.onend = () => {
                        // Auto-restart if video is still playing
                        if (isTranscribing && !video.paused && !video.ended) {
                              try { recognition.start(); } catch (e) { }
                        }
                  };

                  return true;
            }

            function startTranscription() {
                  if (!recognition && !initSpeechRecognition()) return;
                  try {
                        recognition.start();
                        isTranscribing = true;
                        updateTranscriptStatus('Listening...', 'active');
                  } catch (e) {
                        console.warn('Recognition start error:', e);
                  }
            }

            function stopTranscription() {
                  if (recognition) {
                        try { recognition.stop(); } catch (e) { }
                  }
                  isTranscribing = false;
                  updateTranscriptStatus('Paused', 'paused');
                  hideSubtitle();
            }

            // ===== TRANSLATION (Free MyMemory API) =====
            async function translateText(text, targetLang) {
                  if (!text || targetLang === 'en') return text;

                  const cacheKey = `${text}_${targetLang}`;
                  if (translationCache[cacheKey]) return translationCache[cacheKey];

                  // Map our lang codes to full translation codes
                  const langMap = {
                        'te': 'te', 'hi': 'hi', 'ta': 'ta', 'ml': 'ml'
                  };

                  try {
                        const response = await fetch(
                              `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=en|${langMap[targetLang] || targetLang}`
                        );
                        const data = await response.json();

                        if (data.responseStatus === 200 && data.responseData) {
                              const translated = data.responseData.translatedText;
                              translationCache[cacheKey] = translated;
                              return translated;
                        }
                        return text; // Fallback to original
                  } catch (error) {
                        console.warn('Translation error:', error);
                        return text;
                  }
            }

            // ===== SUBTITLE DISPLAY =====
            function showSubtitle(text, isInterim) {
                  const el = document.getElementById('subtitle-overlay');
                  el.textContent = text;
                  el.style.display = 'block';
                  el.style.opacity = isInterim ? '0.7' : '1';
                  el.style.fontStyle = isInterim ? 'italic' : 'normal';

                  // Auto-hide after 5 seconds for final text
                  if (!isInterim) {
                        clearTimeout(el._hideTimer);
                        el._hideTimer = setTimeout(() => {
                              el.style.display = 'none';
                        }, 5000);
                  }
            }

            function hideSubtitle() {
                  const el = document.getElementById('subtitle-overlay');
                  el.style.display = 'none';
            }

            // ===== TRANSCRIPT LIST =====
            function updateTranscriptList() {
                  const list = document.getElementById('transcript-list');
                  const searchTerm = document.getElementById('transcript-search-input').value.toLowerCase().trim();

                  if (transcriptSegments.length === 0) {
                        list.innerHTML = `
                    <div class="transcript-empty">
                        <i class="fa-solid fa-microphone-lines"></i>
                        <div style="font-size:14px; font-weight:600; margin-bottom:6px;">Live Transcription</div>
                        <div style="font-size:13px;">Play the video to start generating subtitles using speech recognition</div>
                    </div>`;
                        return;
                  }

                  const filtered = searchTerm
                        ? transcriptSegments.filter(s =>
                              s.text.toLowerCase().includes(searchTerm) ||
                              (s.translated && s.translated.toLowerCase().includes(searchTerm))
                        )
                        : transcriptSegments;

                  list.innerHTML = filtered.map((seg, i) => {
                        const timeStr = formatTime(seg.time);
                        let displayText = currentLang !== 'en' && seg.translated ? seg.translated : seg.text;

                        // Highlight search matches
                        if (searchTerm) {
                              const regex = new RegExp(`(${escapeRegex(searchTerm)})`, 'gi');
                              displayText = displayText.replace(regex, '<mark>$1</mark>');
                        }

                        const isActive = video.currentTime >= seg.time &&
                              (i + 1 >= filtered.length || video.currentTime < filtered[i + 1]?.time);

                        return `
                    <div class="transcript-item ${isActive ? 'active' : ''} ${searchTerm ? 'highlight' : ''}"
                         onclick="seekTo(${seg.time})">
                        <div class="transcript-time">${timeStr}</div>
                        <div class="transcript-text">${displayText}</div>
                    </div>`;
                  }).join('');

                  // Auto-scroll to active item
                  const activeItem = list.querySelector('.active');
                  if (activeItem && !searchTerm) {
                        activeItem.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                  }
            }

            function updateTranscriptStatus(msg, type) {
                  const el = document.getElementById('transcript-status');
                  if (type === 'active') {
                        el.innerHTML = `<div class="pulse-dot"></div> ${msg}`;
                  } else if (type === 'error') {
                        el.innerHTML = `<i class="fa-solid fa-triangle-exclamation" style="color:#ef4444;"></i> ${msg}`;
                  } else {
                        el.innerHTML = `<i class="fa-solid fa-circle-info"></i> ${msg}`;
                  }
            }

            // ===== HELPERS =====
            function formatTime(seconds) {
                  const m = Math.floor(seconds / 60).toString().padStart(2, '0');
                  const s = Math.floor(seconds % 60).toString().padStart(2, '0');
                  return `${m}:${s}`;
            }

            function escapeRegex(str) {
                  return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            }

            function seekTo(time) {
                  video.currentTime = time;
                  if (video.paused) video.play();
            }

            function showToast(msg) {
                  const el = document.getElementById('status-toast');
                  el.textContent = msg;
                  el.style.display = 'block';
                  clearTimeout(el._timer);
                  el._timer = setTimeout(() => { el.style.display = 'none'; }, 2500);
            }

            // ===== EVENT LISTENERS =====

            // Video play/pause hooks
            video.addEventListener('play', () => {
                  startTranscription();
            });

            video.addEventListener('pause', () => {
                  stopTranscription();
            });

            video.addEventListener('ended', () => {
                  stopTranscription();
                  updateTranscriptStatus(`Transcription complete — ${transcriptSegments.length} segments`, 'done');
            });

            // Update duration when metadata loads
            video.addEventListener('loadedmetadata', () => {
                  const mins = Math.floor(video.duration / 60);
                  const secs = Math.floor(video.duration % 60);
                  document.getElementById('meta-duration').innerHTML = `<i class="fa-regular fa-clock"></i> ${mins}m ${secs}s`;
            });

            // Update active transcript segment
            video.addEventListener('timeupdate', () => {
                  updateTranscriptList();
            });

            // Playback speed
            document.getElementById('speed-select').addEventListener('change', (e) => {
                  video.playbackRate = parseFloat(e.target.value);
                  showToast(`Speed: ${e.target.value}x`);
            });

            // Language change
            document.getElementById('lang-select').addEventListener('change', async (e) => {
                  currentLang = e.target.value;
                  document.getElementById('lang-label').textContent = langNames[currentLang] || 'English';
                  showToast(`Language: ${langNames[currentLang]}`);

                  // Re-translate existing segments
                  if (currentLang !== 'en') {
                        updateTranscriptStatus('Translating...', 'active');
                        for (let seg of transcriptSegments) {
                              seg.translated = await translateText(seg.text, currentLang);
                        }
                        updateTranscriptStatus('Translation complete', 'done');
                  }
                  updateTranscriptList();
            });

            // Subtitle toggle
            document.getElementById('subtitle-btn').addEventListener('click', () => {
                  subtitlesEnabled = !subtitlesEnabled;
                  const btn = document.getElementById('subtitle-btn');
                  btn.classList.toggle('active', subtitlesEnabled);
                  if (!subtitlesEnabled) hideSubtitle();
                  showToast(`Subtitles ${subtitlesEnabled ? 'ON' : 'OFF'}`);
            });

            // Transcript panel toggle
            function toggleTranscriptPanel() {
                  const panel = document.getElementById('transcript-panel');
                  panel.classList.toggle('collapsed');
                  const btn = document.getElementById('transcript-toggle-btn');
                  btn.classList.toggle('active', !panel.classList.contains('collapsed'));
            }

            document.getElementById('transcript-toggle-btn').addEventListener('click', toggleTranscriptPanel);

            // Transcript search
            document.getElementById('transcript-search-input').addEventListener('input', () => {
                  updateTranscriptList();
            });

            // Download
            document.getElementById('download-btn').addEventListener('click', () => {
                  const source = directSrc || (filename ? `${API_BASE}/api/recordings/file/${filename}` : '');
                  if (!source) {
                        showToast('No recording to download');
                        return;
                  }
                  const a = document.createElement('a');
                  a.href = source;
                  a.download = `${title}.webm`;
                  a.target = '_blank';
                  a.click();
                  showToast('Download started');
            });

            // Initialize speech recognition on page load
            initSpeechRecognition();
      </script>
</body>

</html>
